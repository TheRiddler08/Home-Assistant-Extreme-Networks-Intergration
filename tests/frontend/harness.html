<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network panel harness</title>
<!--
  Development harness for the Network panel and cards, outside Home Assistant.
  Serve the repository root (python3 -m http.server) and open
  /tests/frontend/harness.html?view=panel|cards&theme=light|dark&path=<entry_id>
  The fake `hass` streams tests/frontend/demo.json and applies actions to it.
-->
<style>
  /* A subset of Home Assistant's theme variables (default light and dark themes). */
  :root {
    --primary-color: #009ac7; --text-primary-color: #fff; --primary-text-color: #141414; --secondary-text-color: #5e5e5e;
    --primary-background-color: #fafafa; --card-background-color: #fff; --secondary-background-color: #e5e5e5;
    --divider-color: rgba(0, 0, 0, 0.12); --success-color: #43a047; --warning-color: #ffa600; --error-color: #db4437;
    --app-header-background-color: #fafafa; --app-header-text-color: #141414; --ha-card-border-radius: 12px;
    --ha-card-border-color: #e0e0e0; --app-header-border-bottom: 1px solid #e0e0e0;
  }
  :root[data-theme="dark"] {
    --primary-color: #009ac7; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --primary-background-color: #111111; --card-background-color: #1c1c1c; --secondary-background-color: #282828;
    --divider-color: rgba(225, 225, 225, 0.12); --app-header-background-color: #111111; --app-header-text-color: #e1e1e1;
    --ha-card-border-color: rgba(225, 225, 225, 0.12); --app-header-border-bottom: 1px solid rgba(225, 225, 225, 0.12);
  }
  html, body { margin: 0; height: 100%; background: var(--primary-background-color); font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
  aerohive-network-panel { height: 100vh; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; padding: 16px; align-items: start; }
  .cards .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import "../../custom_components/aerohive_local/frontend/aerohive-network.js";

  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
  const snapshot = await (await fetch("demo.json")).json();
  const listeners = new Set();
  const push = () => { snapshot.generated = new Date().toISOString(); for (const cb of listeners) cb(structuredClone(snapshot)); };
  window.serviceCalls = [];


  // Network setup (plan) commands: an in-memory stand-in for the integration.
  const planDevices = () => snapshot.devices.map((d) => ({
    entry_id: d.entry_id, name: d.name, host: d.host, kind: d.cli === "openwrt" ? "openwrt" : d.cli, online: d.online,
    role: d.cli === "exos" ? "switch" : d.cli === "openwrt" && planState.plan.devices.router === d.entry_id ? "router" : (d.radios || []).length ? "ap" : "none",
    wireless: (d.radios || []).length > 0, router_capable: d.cli === "openwrt",
    note: d.cli === "switch" ? "VLANs on SR switches aren't set up from here yet" : null,
  }));
  const planSecrets = {};
  const planState = {
    plan: { networks: [], wifi: [], keys: [], devices: { router: null, router_trunks: ["br-lan"], switch_trunks: {}, aps: null } },
    errors: [], pending: false, applied_at: null, last_results: [], needs_apply: [], audit: [],
  };
  const planErrors = () => planState.plan.wifi.filter((w) => ["wpa2", "wpa2_wpa3", "wpa3"].includes(w.security) && !planSecrets[`wifi:${w.id}`]).map((w) => `${w.ssid}: needs a password`);
  const planView = () => structuredClone({ ...planState, devices: planDevices(), secrets: Object.keys(planSecrets), errors: planErrors(), now: new Date().toISOString() });
  function planMock(msg) {
    const t = msg.type.replace("aerohive_local/plan/", "");
    const log = (action, detail) => planState.audit.unshift({ time: new Date().toISOString(), action, detail, user: "Tester" });
    if (t === "get") return planView();
    if (t === "template") return { plan: {
      networks: [
        { id: "mgmt", name: "Network management", vlan: 10, subnet: "10.10.10.1/24", dhcp: true, dhcp_start: 50, dhcp_limit: 150, lease: "12h", internet: true, router_access: true, reach: [], switch_ports: {} },
        { id: "iot", name: "IoT / Smart home", vlan: 30, subnet: "10.15.19.1/24", dhcp: true, dhcp_start: 50, dhcp_limit: 150, lease: "12h", internet: true, router_access: false, reach: [], switch_ports: {} },
        { id: "iso", name: "homeISO", vlan: 70, subnet: "10.99.199.1/24", dhcp: true, dhcp_start: 50, dhcp_limit: 150, lease: "12h", internet: true, router_access: false, reach: [], switch_ports: {} },
      ],
      wifi: [{ id: "homeiso", ssid: "homeISO", network: "iso", security: "ppsk", bands: ["2.4 GHz"], hidden: false, isolate: true, max_clients: null, enabled: true }],
      keys: [], devices: { router: null, router_trunks: ["br-lan"], switch_trunks: {}, aps: null } } };
    if (t === "save") {
      for (const [ref, value] of Object.entries(msg.secrets || {})) {
        if (value && value.length < 8) throw new Error("Wi-Fi key must be 8-63 printable ASCII characters without double quotes");
        if (value) planSecrets[ref] = value; else delete planSecrets[ref];
      }
      planState.plan = structuredClone(msg.plan);
      for (const w of planState.plan.wifi) if (w.security === "ppsk" && !planSecrets[`wifi:${w.id}`]) planSecrets[`wifi:${w.id}`] = "base-key-xyz";
      planState.pending = true;
      log("plan_saved", `${planState.plan.networks.length} networks`);
      return planView();
    }
    if (t === "preview") return { errors: planErrors(), notes: planState.plan.devices.router ? [] : ["No OpenWrt router chosen"], devices: planDevices().filter((d) => d.role !== "none").map((d) => ({
      entry_id: d.entry_id, name: d.name, role: d.role, online: d.online, errors: [],
      warnings: d.role === "ap" && d.kind === "hiveos" ? ["homeISO: per-device keys on Aerohive access points aren't supported yet; skipped here"] : [],
      commands: planState.plan.networks.map((n) => d.role === "switch" ? `create vlan ${n.id}` : `uci set network.hn_if${n.vlan}=interface`),
    })) };
    if (t === "apply") {
      const results = planDevices().filter((d) => d.role !== "none").map((d) => ({ entry_id: d.entry_id, name: d.name, role: d.role, ok: true, error: null, warnings: [] }));
      planState.pending = false; planState.applied_at = new Date().toISOString(); planState.last_results = results;
      log("applied", "ok");
      return { results, ...planView() };
    }
    if (t === "key_add") {
      const id = msg.name.toLowerCase().replace(/[^a-z0-9]+/g, "_").slice(0, 10);
      planState.plan.keys.push({ id, name: msg.name, wifi: msg.wifi, network: msg.network || null, mac: msg.mac || null, expires: msg.minutes ? new Date(Date.now() + msg.minutes * 60000).toISOString() : null });
      planSecrets[`key:${id}`] = msg.key || "Kx7mPq2vR9tw";
      log("key_added", msg.name);
      return { key_id: id, results: [], ...planView() };
    }
    if (t === "key_revoke") {
      planState.plan.keys = planState.plan.keys.filter((k) => k.id !== msg.key_id);
      delete planSecrets[`key:${msg.key_id}`];
      log("key_revoked", msg.key_id);
      return { results: [], ...planView() };
    }
    if (t === "reveal") {
      if (!planSecrets[msg.ref]) throw new Error("No password or key stored for this");
      return { value: planSecrets[msg.ref] };
    }
    throw new Error(`unknown command ${msg.type}`);
  }

  const device = (id) => snapshot.devices.find((d) => d.device_id === id);
  const port = (d, name) => d.ports.find((p) => p.name === name);
  const hass = {
    connection: {
      async subscribeMessage(cb, msg) {
        if (msg.type !== "aerohive_local/subscribe") throw new Error("unknown command");
        listeners.add(cb);
        setTimeout(() => cb(structuredClone(snapshot)), 50);
        return () => listeners.delete(cb);
      },
    },
    user: { is_admin: params.get("admin") !== "0", name: "Tester" },
    async callWS(msg) {
      window.serviceCalls.push({ domain: "ws", service: msg.type.replace("aerohive_local/", ""), data: msg });
      await new Promise((r) => setTimeout(r, 300));
      if (msg.type.startsWith("aerohive_local/plan/")) return planMock(msg);
      const aps = snapshot.devices.filter((d) => d.online && d.radios && d.radios.length);
      const targets = (msg.entry_ids ? aps.filter((d) => msg.entry_ids.includes(d.entry_id)) : aps);
      const radiosFor = (d, bands) => d.radios.filter((r) => !bands || bands.includes(r.band)).map((r) => r.name);
      const setRadios = (d, s, radios) => { s.radios = radios; s.broadcasting = radios.length > 0; for (const r of d.radios) r.ssids = d.ssids.filter((x) => x.radios.includes(r.name)).map((x) => x.name); };
      snapshot.wifi_timers = snapshot.wifi_timers || [];
      if (msg.type === "aerohive_local/wifi/update") {
        if (msg.password && msg.password.length < 8) throw new Error("Wi-Fi keys need 8-63 characters");
        const before = {};
        for (const d of targets) {
          const s = d.ssids.find((x) => x.name === msg.ssid);
          if (!s) continue;
          before[d.entry_id] = [...s.radios];
          if (msg.enabled !== undefined) setRadios(d, s, msg.enabled ? radiosFor(d, msg.bands) : []);
          else if (msg.bands) setRadios(d, s, radiosFor(d, msg.bands));
          if (msg.hidden !== undefined) s.hidden = msg.hidden;
          if (msg.max_clients !== undefined) s.max_clients = msg.max_clients;
        }
        if (msg.duration_minutes) {
          snapshot.wifi_timers = snapshot.wifi_timers.filter((t) => t.ssid !== msg.ssid);
          snapshot.wifi_timers.push({ ssid: msg.ssid, until: new Date(Date.now() + msg.duration_minutes * 60000).toISOString(), enabled: msg.enabled, restore: before });
        } else if (msg.enabled !== undefined) snapshot.wifi_timers = snapshot.wifi_timers.filter((t) => t.ssid !== msg.ssid);
      } else if (msg.type === "aerohive_local/wifi/create") {
        for (const d of targets) {
          const s = { name: msg.ssid, broadcasting: true, hidden: msg.hidden, clients: 0, radios: [], max_clients: 100, security: msg.password ? "wpa2-aes-psk" : null };
          d.ssids.push(s);
          setRadios(d, s, radiosFor(d, msg.bands));
        }
      } else if (msg.type === "aerohive_local/wifi/delete") {
        for (const d of targets) { d.ssids = d.ssids.filter((x) => x.name !== msg.ssid); setRadios(d, { radios: [] }, []); }
        snapshot.wifi_timers = snapshot.wifi_timers.filter((t) => t.ssid !== msg.ssid);
      } else if (msg.type === "aerohive_local/wifi/timer_cancel") {
        const timer = snapshot.wifi_timers.find((t) => t.ssid === msg.ssid);
        if (timer && msg.restore) for (const d of aps) { const s = d.ssids.find((x) => x.name === msg.ssid); if (s && timer.restore[d.entry_id]) setRadios(d, s, timer.restore[d.entry_id]); }
        snapshot.wifi_timers = snapshot.wifi_timers.filter((t) => t.ssid !== msg.ssid);
      } else throw new Error(`unknown command ${msg.type}`);
      setTimeout(push, 200);
    },
    async callService(domain, service, data) {
      window.serviceCalls.push({ domain, service, data });
      await new Promise((r) => setTimeout(r, 400));
      if (service === "refresh") { setTimeout(push, 100); return; }
      const d = device(data.device_id);
      if (service === "set_port") {
        const p = port(d, data.port);
        if (p.uplink && !data.enabled && !data.force) throw new Error(`${data.port} is an uplink port`);
        p.enabled = data.enabled; if (!data.enabled) { p.up = false; p.speed = null; }
      } else if (service === "set_poe") {
        const p = port(d, data.port); p.poe.enabled = data.enabled; p.poe.delivering = data.enabled && p.up; if (!data.enabled) p.poe.power_w = 0;
      } else if (service === "set_port_description") {
        if (/\s/.test(data.description)) throw new Error("Port names can be up to 15 letters, digits, '-', '_' or '.', without spaces");
        port(d, data.port).label = data.description || null;
      } else if (service === "save_config") {
        d.config.unsaved = false; d.problems = d.problems.filter((p) => p.kind !== "unsaved");
      } else if (service === "accept_config" || service === "restore_config") {
        d.config.changed_after_reboot = false; d.problems = d.problems.filter((p) => p.kind !== "changed_after_reboot");
      }
      setTimeout(push, 300);
    },
  };
  window.hass = hass;

  const root = document.getElementById("root");
  if ((params.get("view") || "panel") === "panel") {
    const panel = document.createElement("aerohive-network-panel");
    panel.hass = hass;
    panel.narrow = innerWidth < 870;
    if (params.get("path")) panel.route = { prefix: "/aerohive-network", path: `/${params.get("path")}` };
    root.appendChild(panel);
  } else {
    root.className = "cards";
    const cards = [
      ["aerohive-switch-card", { device: "X450e-48p", legend: true }, "wide"],
      ["aerohive-network-card", {}],
      ["aerohive-device-card", { device: "AH-Switch" }],
      ["aerohive-device-card", { device: "AH-7c0680" }],
      ["aerohive-switch-card", { device: "AH-Switch" }],
      ["aerohive-wifi-card", {}],
    ];
    for (const [tag, config, cls] of cards) {
      const el = document.createElement(tag);
      el.setConfig(config);
      el.hass = hass;
      if (cls) el.className = cls;
      root.appendChild(el);
    }
  }
  window.harnessReady = true;
</script>
</body>
</html>
