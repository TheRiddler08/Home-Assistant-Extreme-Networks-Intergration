run_show_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aerohive_local
    command:
      required: true
      example: "show station"
      selector:
        text:
    redact:
      default: true
      selector:
        boolean:

set_ssid_password:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aerohive_local
    ssid:
      required: true
      selector:
        text:
    password:
      required: true
      selector:
        text:
          type: password
    security_object:
      required: false
      selector:
        text:

disconnect_client:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aerohive_local
    mac:
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:

create_ssid:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aerohive_local
    ssid:
      required: true
      example: "Guest"
      selector:
        text:
    password:
      required: false
      selector:
        text:
          type: password
    radios:
      required: false
      example: "wifi0, wifi1"
      selector:
        text:
          multiple: true

delete_ssid:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aerohive_local
    ssid:
      required: true
      selector:
        text:

power_cycle_poe:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: aerohive_local
    port:
      required: true
      example: "eth1/1"
      selector:
        text:
