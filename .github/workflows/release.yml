name: Release

# Push a tag like v0.6.0 to publish a GitHub release (HACS installs releases).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/aerohive_local/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match manifest.json version $VERSION"
            exit 1
          fi

      - name: Build zip
        run: |
          cd custom_components/aerohive_local
          zip -r "$GITHUB_WORKSPACE/aerohive_local.zip" . -x "__pycache__/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: aerohive_local.zip
